name: CI

on:
  push:
    branches: [main, next]
  pull_request:

permissions:
  contents: read

# A pull request's newer push replaces its older run. Pushes to main and next
# run to the end, so every merge commit gets a result and a run of merges
# shows which one broke the branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Lua 5.1
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1

      # A fresh clone has no built data (it needs the game client and local
      # sources), so the tests that read it skip with a reason.
      - name: Test
        run: npm test

      # The interface translations: every locale file loads, no stale key, no
      # broken format; glossary drift only warns. npm test checks the same;
      # this step prints each language's counts and warnings on their own.
      - name: Translations
        run: npm run i18n:check

      # Every changelog fragment in changes/ has a section and an entry, and
      # CHANGELOG.md has no "Unreleased" section of its own (forge changelog
      # check; a debug build of forge, cached between runs).
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Changelog fragments
        working-directory: rust
        run: cargo run --locked -q -p forge -- changelog check --root ..

      # The textures are generated from code alone, so CI rebuilds them to
      # verify the generators work. Committed copies are kept fresh by the
      # maintainer after merging PRs that touch tools/media (polestar regen).
      - name: Textures build clean
        run: node tools/polestar.js media

      # The UI renders are generated from the addon's Lua and frozen fixtures
      # (no reference data, no shipped guides). CI renders them to verify the
      # renderer works. Committed SVGs are kept fresh by the maintainer after
      # merging UI PRs (polestar regen). A UI change never requires a guide
      # recompile; a guide change never affects these renders.
      - name: Previews build clean
        run: node tools/polestar.js preview
